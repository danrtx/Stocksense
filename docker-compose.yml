# Levanta todo el sistema en local con un solo comando:
#   docker compose up --build
# Frontend: http://localhost:8080 · API: http://localhost:3000/api · Correos: http://localhost:8025
# Si algún puerto ya está ocupado en tu equipo, cámbialo en .env (DB_PORT, API_PORT, WEB_PORT,
# MAIL_UI_PORT, MAIL_SMTP_PORT). Los contenedores siguen hablando entre sí por sus puertos internos.
name: stocksense

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksense}
      POSTGRES_DB: ${POSTGRES_DB:-stocksense}
    ports:
      # 5433 por defecto para no chocar con un PostgreSQL instalado en el equipo.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocksense}"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"   # bandeja web para ver las invitaciones
      - "${MAIL_SMTP_PORT:-1025}:1025" # SMTP

  backend:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: ${APP_ENV:-development}
      # Si falta, docker compose se detiene antes de arrancar y dice qué hacer.
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET. Copia .env.example como .env (no crees un .env vacío)}
      DATABASE_URL: postgres://${POSTGRES_USER:-stocksense}:${POSTGRES_PASSWORD:-stocksense}@db:5432/${POSTGRES_DB:-stocksense}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      FORECAST_URL: http://forecast:8000
      FORECAST_TOKEN: ${FORECAST_TOKEN:-cambia-este-token-interno}
      # Sprint 7: Gemini. Sin clave, la app funciona igual y sin las funciones de IA.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Servicio de pronóstico y del modelo del asistente en Python (HU-18, HU-19, HU-22, HU-33).
  # No se publica fuera de la red interna. Toma los trabajos de la cola ml_jobs.
  forecast:
    build: ./forecast
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stocksense}:${POSTGRES_PASSWORD:-stocksense}@db:5432/${POSTGRES_DB:-stocksense}
      FORECAST_TOKEN: ${FORECAST_TOKEN:-cambia-este-token-interno}
      PIPELINE_DAILY_AT: ${PIPELINE_DAILY_AT:-02:00}
      # Avisos de falla del reentrenamiento (T-22.3). Vacío = las personas administradoras.
      TECH_ALERT_EMAILS: ${TECH_ALERT_EMAILS:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
    depends_on:
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
