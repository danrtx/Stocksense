[project]
name = "stocksense-forecast"
version = "0.1.0"
description = "Servicio de pronóstico de demanda de StockSense"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
