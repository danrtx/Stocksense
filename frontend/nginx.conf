server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La API vive en otro contenedor; el navegador solo ve un dominio.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cargas de CSV grandes (historial de ventas de hasta 60 MB) y su procesamiento.
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Rutas de React Router (por ejemplo /productos) devuelven index.html.
  location / {
    try_files $uri /index.html;
  }

  # Cabeceras de seguridad (HU-29, revisión OWASP): nada externo, sin marcos, sin scripts en línea.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
